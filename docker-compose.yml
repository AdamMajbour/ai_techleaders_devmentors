# Local PostgreSQL for development, integration tests and E2E (see .env.example).
#   docker compose up -d db
# If localhost:5432 is occupied, set POSTGRES_HOST_PORT=5433 in the root .env
# and DATABASE_PORT=5433 in .env.local.
# Credentials match the defaults in packages/db/src/config, so no .env.local is needed.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devmentor
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - devmentor-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devmentor"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  devmentor-db:
