name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: Version bump or custom version
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: Exact version to release (for custom selection)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect an unpublished release tag
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest_tag=$(git tag --list 'v*' --sort=-version:refname | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | head -n 1 || true)
          if [ -n "$latest_tag" ] && ! gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -Fxq "$latest_tag"; then
            echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve version and validate changelog
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TYPE: ${{ inputs.version_type }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          PENDING_TAG: ${{ steps.pending.outputs.tag }}
        run: node scripts/prepare-release.mjs

      - name: Create and push release tag
        if: steps.version.outputs.tag_exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "${TAG}" -m "DevMentor ${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; leaving it unchanged."
          else
            gh release create "${TAG}" --title "DevMentor ${TAG}" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
