name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: Version bump or custom version
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: Exact version to release (for custom selection)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve version, changelog entry, and package manifests
        id: version
        env:
          VERSION_TYPE: ${{ inputs.version_type }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          node scripts/prepare-release.mjs

      - name: Commit versions and create rollback tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json packages/**/package.json
          git commit -m "chore(release): prepare ${TAG}"
          git tag -a "${TAG}" -m "DevMentor ${TAG}"
          git push origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/${TAG}"

      - name: Publish GitHub Release from changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${TAG}" --title "DevMentor ${TAG}" --notes-file "$RUNNER_TEMP/release-notes.md"
