name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: Version bump or custom version
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: Exact version to release (for custom selection)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve version and validate changelog
        id: version
        env:
          VERSION_TYPE: ${{ inputs.version_type }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: node scripts/prepare-release.mjs

      - name: Commit package versions and create tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json packages/*/package.json
          git commit -m "chore(release): prepare ${TAG}"
          git tag -a "${TAG}" -m "DevMentor ${TAG}"
          git push origin HEAD:main "refs/tags/${TAG}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "${TAG}" --title "DevMentor ${TAG}" --notes-file "$RUNNER_TEMP/release-notes.md"
